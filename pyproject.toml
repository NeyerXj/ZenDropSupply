[project]
name = "zendrop-supply"
version = "0.1.0"
description = "Distributed Zendrop catalog harvester with controller UI and worker containers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<0.29",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
