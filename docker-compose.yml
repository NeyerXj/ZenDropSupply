services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zendrop_supply
      POSTGRES_USER: zendrop
      POSTGRES_PASSWORD: zendrop
    volumes:
      - zendrop_supply_postgres:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendrop -d zendrop_supply"]
      interval: 5s
      timeout: 5s
      retries: 10

  controller:
    build: .
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://zendrop:zendrop@postgres:5432/zendrop_supply
    ports:
      - "8091:8090"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.controller:app --host 0.0.0.0 --port 8090

  worker:
    build: .
    working_dir: /app
    profiles: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://zendrop:zendrop@postgres:5432/zendrop_supply
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.worker

volumes:
  zendrop_supply_postgres:
